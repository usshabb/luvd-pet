# Fly.io config for LUVD. One machine, one volume: web + nightly scrape
# share it (see fly-start.sh). Caddy from docker-compose is not needed — Fly
# terminates TLS at its edge.
app = "luvd-nyc"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "sh /app/fly-start.sh"

[mounts]
  source = "luvd_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  # The nightly loop lives in this machine — it must never be stopped for idleness.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "8s"
    grace_period = "30s"
    method = "GET"
    path = "/views"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
